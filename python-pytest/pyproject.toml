[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "aegis-replay-python-poc"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = []

[tool.pytest.ini_options]
addopts = "--junitxml=reports/junit.xml"
testpaths = ["tests"]
pythonpath = ["src"]
