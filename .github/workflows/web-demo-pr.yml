name: Web regression demo
on:
  pull_request:
    paths:
      - 'typescript-jest/**'
      - '.aegis/**'
      - 'aegis.yaml'
jobs:
  replay-web-regression:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Install Aegis demo candidate
        run: python -m pip install 'git+https://github.com/samir-sayyed/aegis-replay.git@f0acb76322a5d1a8747705bbea0a0be072300e69'
      - name: Replay selected web regression
        run: ./web-demo-pr-check.sh
