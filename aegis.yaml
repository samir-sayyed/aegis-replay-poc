schema_version: 1
targets:
  - name: kotlin-gradle
    runner: gradle-junit
    directory: kotlin-gradle
    command: [gradle, test]
    junit_xml: build/test-results/test/TEST-*.xml
    scope:
      - kotlin-gradle/src
  - name: swift-xcode
    runner: xcode-junit
    directory: swift-xcode
    command: [./run-tests.sh]
    junit_xml: reports/junit.xml
    scope:
      - swift-xcode/Sources
      - swift-xcode/Tests
  - name: typescript-jest
    runner: jest-junit
    directory: typescript-jest
    command: [npm, test]
    junit_xml: reports/junit.xml
    scope:
      - typescript-jest/src
      - typescript-jest/tests
  - name: python-pytest
    runner: pytest-junit
    directory: python-pytest
    command: [python, -m, pytest, tests/test_greeting.py::test_greeting_preserves_input_case]
    junit_xml: reports/junit.xml
    scope:
      - python-pytest/src
      - python-pytest/tests
