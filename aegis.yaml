schema_version: 1
targets:
  - name: generic-command
    runner: command-junit
    directory: generic-command
    command: [python, runner.py]
    junit_xml: reports/junit.xml
    scope:
      - generic-command/state.txt
  - name: kotlin-gradle
    runner: gradle-junit
    directory: kotlin-gradle
    command: [gradle, test, --tests, poc.HealthTest.healthyStatusIsAccepted]
    junit_xml: build/test-results/test/TEST-*.xml
    scope:
      - kotlin-gradle/src
  - name: swift-xcode
    runner: xcode-junit
    directory: swift-xcode
    command: [./run-tests.sh, --filter, PocLibraryTests.StatusTests/testActiveStatusIsRunnable]
    junit_xml: reports/junit.xml
    environment:
      AEGIS_XCODE_ONLY_TESTING: PocLibraryTests/StatusTests/testActiveStatusIsRunnable
    scope:
      - swift-xcode/Sources
      - swift-xcode/Tests
  - name: typescript-jest
    runner: jest-junit
    directory: typescript-jest
    command: [npm, test, --, --testNamePattern, "retains items in the requested category"]
    proof_command: [./run-proof.sh]
    junit_xml: reports/junit.xml
    scope:
      - typescript-jest/src
      - typescript-jest/tests
  - name: python-pytest
    runner: pytest-junit
    directory: python-pytest
    command: [python, -m, pytest, "tests/test_greeting.py::test_greeting_preserves_input_case"]
    proof_command: [python, -m, pytest, tests/test_greeting.py]
    junit_xml: reports/junit.xml
    scope:
      - python-pytest/src
      - python-pytest/tests
